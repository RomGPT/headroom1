<svg width="1280" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="400" fill="#0d1117"/>

  <!-- Title -->
  <text x="80" y="138"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="54"
        font-weight="bold"
        fill="#e6edf3"
        letter-spacing="-1">headroom</text>

  <!-- Subtitle -->
  <text x="83" y="182"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="20"
        fill="#6e7681">context window usage for Claude Code</text>

  <line x1="80" y1="212" x2="580" y2="212" stroke="#21262d" stroke-width="1"/>

  <!-- Bar examples -->
  <text x="80" y="258"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="30"
        fill="#e6edf3">██░░░░░░░░  22.4%</text>

  <text x="80" y="304"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="30"
        fill="#e6edf3">███████░░░  68.1%</text>

  <text x="80" y="350"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="30"
        fill="#e6edf3">█████████░  91.0%</text>

  <!-- Terminal box -->
  <rect x="740" y="70" width="460" height="260" rx="10"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic lights -->
  <circle cx="778" cy="102" r="7" fill="#ff5f57"/>
  <circle cx="806" cy="102" r="7" fill="#febc2e"/>
  <circle cx="834" cy="102" r="7" fill="#28c840"/>

  <!-- Terminal content -->
  <text x="778" y="152"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="15" fill="#6e7681">~ claude</text>

  <text x="778" y="192"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="24" fill="#e6edf3">████████░░ 78.3%</text>

  <text x="778" y="234"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="14" fill="#58a6ff">✦ claude</text>

  <text x="843" y="234"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="14" fill="#6e7681">  main  14:22</text>

  <!-- Install line -->
  <rect x="740" y="348" width="460" height="44" rx="6"
        fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="758" y="376"
        font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono',monospace"
        font-size="14" fill="#6e7681">curl -fsSL <tspan fill="#58a6ff">…/install.sh</tspan> | bash</text>
</svg>
